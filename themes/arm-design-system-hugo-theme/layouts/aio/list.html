{{ define "main" }}

<div class="c-row u-margin-top-2">
  <div class="c-col">

    <div class="aio-container">

      <h1 class="aio-title">AI Overview Prototype</h1>
      <p class="aio-subtitle">
        Prototype: mocked single-turn AI overview UI (no live model or backend connected)
      </p>

      <!-- Search -->
      <div class="aio-search-box">
        <input id="searchInput" class="aio-search-input" disabled placeholder="Select a query below..." />
      </div>

      <!-- Example prompts -->
      <div id="examples" class="aio-examples">
        <button class="aio-chip" onclick="runQuery('docker')">
          How do I install Docker Engine on Linux?
        </button>
        <button class="aio-chip" onclick="runQuery('redis')">
          Deploy Redis on Arm cloud
        </button>
        <button class="aio-chip" onclick="runQuery('sme')">
          What are the learning paths showing SME?
        </button>
      </div>

      <!-- Layout -->
      <div id="layout" class="aio-layout">

        <!-- LEFT -->
        <div class="aio-left">
          <div id="mainContent" class="aio-card"></div>
        </div>

        <!-- RIGHT -->
        <div class="aio-right">
          <div class="aio-card">
            <h3>Sources</h3>
            <div id="sources"></div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<!-- Bottom spacing -->
<div style="height:200px;"></div>

<style>
.aio-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 10px 10px 40px 10px;
}

.aio-title {
  color: #fff;
  margin-bottom: 8px;
}

.aio-subtitle {
  color: #A3A8AE;
  margin-bottom: 24px;
}

.aio-search-box {
  background: #1f2328;
  border: 1px solid #2d333b;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}

.aio-search-input {
  width: 100%;
  background: transparent;
  border: none;
  color: #e6edf3;
  font-size: 16px;
}

.aio-examples {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.aio-chip {
  background: #2d333b;
  border: 1px solid #444c56;
  color: #c9d1d9;
  padding: 10px 16px;
  border-radius: 20px;
  cursor: pointer;
}

.aio-chip:hover {
  background: #373e47;
}

.aio-layout {
  display: none;
  margin-top: 30px;
  gap: 24px;
}

.aio-left {
  flex: 2;
}

.aio-right {
  flex: 1;
}

.aio-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
  color: #e6edf3;
}

.aio-query {
  font-weight: 600;
  margin-bottom: 12px;
}

pre {
  background: #0d1117;
  border: 1px solid #30363d;
  padding: 14px;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 13px;
}

.aio-options button {
  width: 100%;
  margin: 8px 0;
  padding: 12px;
  background: #21262d;
  border: 1px solid #30363d;
  color: #c9d1d9;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
}

.aio-options button:hover {
  background: #2d333b;
}

.aio-reset {
  background: #30363d;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
}

.aio-source a {
  color: #58a6ff;
  text-decoration: none;
}

.aio-source a:hover {
  text-decoration: underline;
}

.loader-wrap {
  display: flex;
  justify-content: center;
  padding: 40px 0;
}

@media (max-width: 900px) {
  .aio-layout {
    flex-direction: column;
  }
}
</style>

<script>
function showLoader() {
  document.getElementById("mainContent").innerHTML = `
    <div class="loader-wrap">
      <ads-loader label="loading"></ads-loader>
    </div>
  `;
  document.getElementById("sources").innerHTML = "";
}

function runQuery(type) {
  document.getElementById("layout").style.display = "flex";
  document.getElementById("examples").style.display = "none";

  if (type === "docker") {
    document.getElementById("searchInput").value = "How do I install Docker Engine on Linux?";
    showLoader();
    setTimeout(renderDocker, 2000);
  }

  if (type === "redis") {
    document.getElementById("searchInput").value = "Deploy Redis on Arm cloud";
    showLoader();
    setTimeout(renderRedisOptions, 2000);
  }
  if (type === "sme") {
  document.getElementById("searchInput").value = "What are the learning paths showing SME?";
  showLoader();
  setTimeout(renderSME, 2000);
}
}




function renderSME() {
  document.getElementById("mainContent").innerHTML = `
    <p>
      Yeah — we’ve got a few solid learning paths around Arm SME (Scalable Matrix Extension), depending on what you’re trying to do. Some are more focused on fundamentals, while others go deeper into performance and real workloads.
    </p>

    <p>
      If you're just getting started, there’s a path on vectorizing loops using SIMD and SME, which shows how to take advantage of the hardware for parallelism. From there, you can step up into more compute-heavy examples like matrix multiplication using SME2, which is where you really start to see the performance benefits on modern Arm processors.
    </p>

    <p>
      There’s also a more advanced path that looks at profiling SME workloads with ExecuTorch, which is useful if you’re working on ML or AI pipelines and want to understand how SME impacts performance at runtime. So overall, we’ve got coverage from basic vectorization → matrix math → real-world profiling workflows.
    </p>
  `;

  document.getElementById("sources").innerHTML = `
    <div class="aio-source">
      <a href="https://learn.arm.com/learning-paths/cross-platform/simd-loops/" target="_blank">
        SIMD Loops and Vectorization
      </a>
    </div>
    <div class="aio-source">
      <a href="https://learn.arm.com/learning-paths/cross-platform/multiplying-matrices-with-sme2/" target="_blank">
        Matrix Multiplication with SME2
      </a>
    </div>
    <div class="aio-source">
      <a href="https://learn.arm.com/learning-paths/cross-platform/sme-executorch-profiling/" target="_blank">
        SME Profiling with ExecuTorch
      </a>
    </div>
  `;
}

function renderDocker() {
  document.getElementById("mainContent").innerHTML = `
    <p>Installs Docker Engine and verifies with a test container.</p>

<pre>
sudo apt-get update
sudo apt-get install -y ca-certificates curl gnupg

sudo apt-get install -y docker-ce docker-ce-cli containerd.io

sudo docker run hello-world
</pre>
  `;

  document.getElementById("sources").innerHTML = `
    <div class="aio-source">
      <a href="https://learn.arm.com/install-guides/docker/docker-engine/" target="_blank">
        Docker Engine Install Guide
      </a>
    </div>
  `;
}


function renderRedisOptions() {
  document.getElementById("mainContent").innerHTML = `
    <div class="aio-query">Deploy Redis on Arm cloud</div>
    <h3>Where do you want to deploy Redis?</h3>

    <div class="aio-options">
      <button onclick="handleOption('azure')">A) Azure Cobalt 100 VMs</button>
      <button onclick="handleOption('gcp')">B) Google Cloud C4A</button>
      <button onclick="handleOption('other')">C) Other</button>
    </div>
  `;
}

function handleOption(type) {
  showLoader();
  setTimeout(() => {
    if (type === "azure") renderAzure();
    if (type === "gcp") renderGCP();
    if (type === "other") renderOther();
  }, 2000);
}

function renderAzure() {
  document.getElementById("mainContent").innerHTML = `
    <p>
      This learning path walks through deploying Redis on Azure Cobalt 100 Arm64 virtual machines, starting from provisioning the VM all the way through validating that Redis is running correctly. You install Redis using the system package manager, start the service, and verify connectivity using the Redis CLI to ensure the instance is responding as expected.
    </p>

    <p>
      From there, it goes beyond basic setup into real usage patterns. You explore Redis Pub/Sub for real-time messaging between services, and Redis Streams for handling event-driven workloads. These examples help demonstrate how Redis is typically used in production systems on Arm-based cloud infrastructure.
    </p>

    <p>
      The final part focuses on performance validation using tools like <code>redis-benchmark</code>, giving you a sense of throughput and latency on Cobalt 100. If you’re looking to optimize performance further, check out the Redis tuning guide below. And if your use case is specifically caching, there’s a dedicated learning path for that as well.
    </p>

<pre>
sudo apt update
sudo apt install redis-server -y

redis-cli ping

redis-benchmark -q -n 10000 -c 50
</pre>
  `;

  document.getElementById("sources").innerHTML = `
    <div class="aio-source">
      <a href="https://learn.arm.com/learning-paths/servers-and-cloud-computing/redis-cobalt/" target="_blank">
        Redis on Azure Cobalt 100
      </a>
    </div>
    <div class="aio-source">
      <a href="https://learn.arm.com/learning-paths/servers-and-cloud-computing/redis_tune/" target="_blank">
        Redis Performance Tuning on Arm
      </a>
    </div>
    <div class="aio-source">
      <a href="https://learn.arm.com/learning-paths/servers-and-cloud-computing/redis_cache/" target="_blank">
        Using Redis as a Cache
      </a>
    </div>
  `;
}


function renderGCP() {
  document.getElementById("mainContent").innerHTML = `
    <p>
      This learning path shows how to deploy Redis on Google Cloud C4A Arm-based virtual machines (powered by Axion). You start by provisioning a VM, installing Redis, and verifying that the service is running correctly using standard CLI tools.
    </p>

    <p>
      Once Redis is up, the focus shifts to working with in-memory datasets and executing queries efficiently. The examples demonstrate how Redis can be used for fast data access patterns, making it ideal for workloads that require low latency and high throughput.
    </p>

    <p>
      The guide also includes benchmarking using <code>redis-benchmark</code> to evaluate performance on Arm-based cloud infrastructure. If you want to go deeper on optimization, the tuning guide linked below is a good next step. And for cache-specific use cases, there’s a separate learning path covering Redis as a caching layer.
    </p>

<pre>
sudo apt update
sudo apt install redis-server -y

redis-benchmark -q -n 10000
</pre>
  `;

  document.getElementById("sources").innerHTML = `
    <div class="aio-source">
      <a href="https://learn.arm.com/learning-paths/servers-and-cloud-computing/redis-data-searching/" target="_blank">
        Redis Data Searching on Google Cloud C4A
      </a>
    </div>
    <div class="aio-source">
      <a href="https://learn.arm.com/learning-paths/servers-and-cloud-computing/redis_tune/" target="_blank">
        Redis Performance Tuning on Arm
      </a>
    </div>
    <div class="aio-source">
      <a href="https://learn.arm.com/learning-paths/servers-and-cloud-computing/redis_cache/" target="_blank">
        Using Redis as a Cache
      </a>
    </div>
  `;
}

function renderOther() {
  document.getElementById("mainContent").innerHTML = `
    <p>This deployment scenario is not supported in this prototype.</p>
  `;

  document.getElementById("sources").innerHTML = `<div>No sources available</div>`;
}

function resetUI() {
  document.getElementById("layout").style.display = "none";
  document.getElementById("examples").style.display = "flex";
  document.getElementById("searchInput").value = "";
}
</script>

{{ end }}
