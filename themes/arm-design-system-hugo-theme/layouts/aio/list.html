{{ define "main" }}

<div class="c-row u-margin-top-2">
  <div class="c-col">

    <div class="aio-container">

      <h1 class="aio-title">AI Overview Prototype</h1>
      <p class="aio-subtitle">
        Prototype: mocked single-turn AI overview UI (no live model or backend connected)
      </p>

      <!-- Search -->
      <div class="aio-search-box">
        <input id="searchInput" class="aio-search-input" disabled placeholder="Select a query below..." />
      </div>

      <!-- Example prompts -->
      <div id="examples" class="aio-examples">
        <button class="aio-chip" onclick="runQuery('docker')">
          How do I install Docker Engine on Linux?
        </button>
          <button class="aio-chip" onclick="runQuery('mlgraphics')">
            Help me get started with deploying ML models for graphics
          </button>
          <button class="aio-chip" onclick="runQuery('performix')">
            Performix
          </button>
        </div>

        <div id="layout" class="aio-layout">
          <!-- LEFT -->
          <div class="aio-left">
            <div id="mainContent" class="aio-card"></div>
          </div>
        <!-- RIGHT -->
        <div class="aio-right">
          <div class="aio-card">
            <h3>Sources</h3>
            <div id="sources"></div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<!-- Bottom spacing -->
<div style="height:200px;"></div>

<style>
.aio-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 10px 10px 40px 10px;
}

.aio-title {
  color: #fff;
  margin-bottom: 8px;
}

.aio-subtitle {
  color: #A3A8AE;
  margin-bottom: 24px;
}

.aio-search-box {
  background: #1f2328;
  border: 1px solid #2d333b;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}

.aio-search-input {
  width: 100%;
  background: transparent;
  border: none;
  color: #e6edf3;
  font-size: 16px;
}

.aio-examples {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.aio-chip {
  background: #2d333b;
  border: 1px solid #444c56;
  color: #c9d1d9;
  padding: 10px 16px;
  border-radius: 20px;
  cursor: pointer;
}

.aio-chip:hover {
  background: #373e47;
}

.aio-layout {
  display: none;
  margin-top: 30px;
  gap: 24px;
}

.aio-left {
  flex: 2;
}

.aio-right {
  flex: 1;
}

.aio-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
  color: #e6edf3;
}

.aio-query {
  font-weight: 600;
  margin-bottom: 12px;
}

pre {
  background: #0d1117;
  border: 1px solid #30363d;
  padding: 14px;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 13px;
}

.aio-options button {
  width: 100%;
  margin: 8px 0;
  padding: 12px;
  background: #21262d;
  border: 1px solid #30363d;
  color: #c9d1d9;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
}

.aio-options button:hover {
  background: #2d333b;
}

.aio-reset {
  background: #30363d;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
}

.aio-source a {
  color: #58a6ff;
  text-decoration: none;
}

.aio-source a:hover {
  text-decoration: underline;
}

.loader-wrap {
  display: flex;
  justify-content: center;
  padding: 40px 0;
}

@media (max-width: 900px) {
  .aio-layout {
    flex-direction: column;
  }
}
</style>

<script>
function showLoader() {
  document.getElementById("mainContent").innerHTML = `
    <div class="loader-wrap">
      <ads-loader label="loading"></ads-loader>
    </div>
  `;
  document.getElementById("sources").innerHTML = "";
}

function runQuery(type) {
  document.getElementById("layout").style.display = "flex";
  document.getElementById("examples").style.display = "none";

  if (type === "docker") {
    document.getElementById("searchInput").value = "How do I install Docker Engine on Linux?";
    showLoader();
    setTimeout(renderDocker, 2000);
  }

  if (type === "mlgraphics") {
    document.getElementById("searchInput").value = "Help me get started with deploying ML models for graphics";
    showLoader();
    setTimeout(renderMLGraphics, 2000);
  }

  if (type === "performix") {
      document.getElementById("searchInput").value = "Performix";
    showLoader();
    setTimeout(renderPerformix, 2000);
  }
}

function renderDocker() {
  document.getElementById("mainContent").innerHTML = `
    <h2>Install Docker Engine on Linux</h2>

    <p>
      These steps work on any Linux machine and any architecture — from an Arm cloud server to a Raspberry Pi. They also work inside WSL 2 on Windows.
    </p>

    <h3>Step 1: Run the installer</h3>
    <p>Download and run the official Docker install script. This works on Ubuntu, Debian, RHEL, Fedora, and CentOS.</p>
<pre>
curl -fsSL get.docker.com -o get-docker.sh && sh get-docker.sh
</pre>

    <h3>Step 2: Add your user to the Docker group</h3>
    <p>This lets you run Docker commands without <code>sudo</code>. The <code>newgrp</code> command applies the change immediately without needing to log out.</p>
<pre>
sudo usermod -aG docker $USER ; newgrp docker
</pre>

    <h3>Step 3: Verify the installation</h3>
    <p>Run a test container to confirm Docker is working correctly.</p>
<pre>
docker run hello-world
</pre>
    <p>You should see a message starting with <em>"Hello from Docker!"</em> confirming the install succeeded.</p>

    <h3>Step 4: Check your architecture (optional)</h3>
    <p>To confirm you're running on Arm, check the machine architecture:</p>
<pre>
uname -m
</pre>
    <p>Expected output: <code>aarch64</code> (Arm 64-bit), <code>armv7l</code> (Arm 32-bit), or <code>x86_64</code> (x86).</p>

    <hr/>

    <h3>Not on Ubuntu/Debian/RHEL/Fedora?</h3>
    <p>If you're on a distribution that doesn't support <code>get.docker.com</code> (such as Manjaro), use your system package manager instead:</p>
<pre>
sudo pacman -Syu
sudo pacman -S docker
sudo systemctl enable docker
sudo systemctl start docker
sudo usermod -aG docker $USER ; newgrp docker
</pre>

    <button class="aio-reset" onclick="resetUI()">&#8592; Ask another question</button>
  `;

  document.getElementById("sources").innerHTML = `
    <div class="aio-source">
      <a href="https://learn.arm.com/install-guides/docker/docker-engine/" target="_blank">
        Docker Engine Install Guide
      </a>
    </div>
    <div class="aio-source">
      <a href="https://learn.arm.com/tag/docker/" target="_blank">
        Docker Learning Paths on Arm
      </a>
    </div>
  `;
}

function resetUI() {

</script>
