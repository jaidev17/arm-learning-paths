{{ define "main" }}

<div class="c-row u-margin-top-2">
  <div class="c-col">

    <div class="aio-container">

      <h1 class="aio-title">AI Overview Prototype</h1>
      <p class="aio-subtitle">
        Prototype: mocked single-turn AI overview UI (no live model or backend connected)
      </p>

      <!-- Search -->
      <div class="aio-search-box">
        <input id="searchInput" class="aio-search-input" disabled placeholder="Select a query below..." />
      </div>

      <!-- Example prompts -->
      <div id="examples" class="aio-examples">
        <button class="aio-chip" onclick="runQuery('docker')">
          How do I install Docker Engine on Linux?
        </button>
        <button class="aio-chip" onclick="runQuery('redis')">
          Deploy Redis on Arm cloud
        </button>
        <button class="aio-chip" onclick="runQuery('sme')">
          What are the learning paths showing SME?
        </button>
        <button class="aio-chip" onclick="runQuery('ml-graphics')">
          Help me get started with what I need to deploy ML models for graphics
        </button>
      </div>

      <!-- Layout -->
      <div id="layout" class="aio-layout">

        <!-- LEFT -->
        <div class="aio-left">
          <div id="mainContent" class="aio-card"></div>
        </div>

      </div>

    </div>
  </div>
</div>

<!-- Bottom spacing -->
<div style="height:200px;"></div>

<style>
.aio-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 10px 10px 40px 10px;
}

.aio-title {
  color: #fff;
  margin-bottom: 8px;
}

.aio-subtitle {
  color: #A3A8AE;
  margin-bottom: 24px;
}

.aio-search-box {
  background: #1f2328;
  border: 1px solid #2d333b;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}

.aio-search-input {
  width: 100%;
  background: transparent;
  border: none;
  color: #e6edf3;
  font-size: 16px;
}

.aio-examples {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.aio-chip {
  background: #2d333b;
  border: 1px solid #444c56;
  color: #c9d1d9;
  padding: 10px 16px;
  border-radius: 20px;
  cursor: pointer;
}

.aio-chip:hover {
  background: #373e47;
}

.aio-layout {
  display: none;
  margin-top: 30px;
  gap: 24px;
}

.aio-left {
  flex: 2;
}


.aio-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
  color: #e6edf3;
}

.aio-query {
  font-weight: 600;
  margin-bottom: 12px;
}

pre {
  background: #0d1117;
  border: 1px solid #30363d;
  padding: 14px;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 13px;
}

.aio-options button {
  width: 100%;
  margin: 8px 0;
  padding: 12px;
  background: #21262d;
  border: 1px solid #30363d;
  color: #c9d1d9;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
}

.aio-options button:hover {
  background: #2d333b;
}

.aio-reset {
  background: #30363d;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
}


.loader-wrap {
  display: flex;
  justify-content: center;
  padding: 40px 0;
}

@media (max-width: 900px) {
  .aio-layout {
    flex-direction: column;
  }
}
</style>

<script>
function showLoader() {
  document.getElementById("mainContent").innerHTML = `
    <div class="loader-wrap">
      <ads-loader label="loading"></ads-loader>
    </div>
  `;
}

function runQuery(type) {
  document.getElementById("layout").style.display = "flex";
  document.getElementById("examples").style.display = "none";

  if (type === "docker") {
    document.getElementById("searchInput").value = "How do I install Docker Engine on Linux?";
    showLoader();
    setTimeout(renderDocker, 2000);
  }

  if (type === "redis") {
    document.getElementById("searchInput").value = "Deploy Redis on Arm cloud";
    showLoader();
    setTimeout(renderRedisOptions, 2000);
  }
  if (type === "sme") {
  document.getElementById("searchInput").value = "What are the learning paths showing SME?";
  showLoader();
  setTimeout(renderSME, 2000);
}
  if (type === "ml-graphics") {
  document.getElementById("searchInput").value = "Help me get started with what I need to deploy ML models for graphics";
  showLoader();
  setTimeout(renderMLGraphics, 2000);
}
}




function renderSME() {
  document.getElementById("mainContent").innerHTML = `
    <p><strong>AI Overview</strong></p>
    <p>Arm Learning Paths featuring Scalable Matrix Extension (SME/SME2) help developers accelerate AI and matrix computations. The paths below focus on hands-on optimization workflows for Arm processors.</p>

    <p><strong>Key learning paths for Arm SME/SME2</strong></p>
    <ul>
      <li><a href="https://learn.arm.com/learning-paths/cross-platform/simd-loops/" target="_blank">Learn SVE and SME programming with SIMD Loops</a> — accelerate matrix operations and learn SVE2/SME2 fundamentals.</li>
      <li><a href="https://learn.arm.com/learning-paths/cross-platform/multiplying-matrices-with-sme2/" target="_blank">Multiplying matrices with SME2</a> — apply SME2 matrix instructions for high-performance compute.</li>
      <li><a href="https://learn.arm.com/learning-paths/cross-platform/sme-executorch-profiling/" target="_blank">Explore ExecuTorch profiling with SME2</a> — analyze performance, find bottlenecks, and optimize inference.</li>
    </ul>

    <br />
    <p>These paths give you a practical arc from SME fundamentals to applied optimization and profiling.</p>
  `;

}

function renderMLGraphics() {
  document.getElementById("mainContent").innerHTML = `
    <p><strong>AI Overview</strong></p>
    <p>To deploy ML models on Arm graphics (Mali GPUs), start with Vulkan ML extensions and neural graphics workflows, then move into profiling and game engine integrations.</p>

    <p><strong>Arm Learning Paths</strong></p>
    <ul>
      <li><a href="https://learn.arm.com/learning-paths/mobile-graphics-and-gaming/vulkan-ml-sample/" target="_blank">Enable neural graphics using ML Extensions for Vulkan</a> — execute neural networks directly on the GPU with Vulkan dataflow graphs.</li>
      <li><a href="https://learn.arm.com/learning-paths/mobile-graphics-and-gaming/nss-unreal/" target="_blank">Enable Neural Super Sampling in Unreal Engine with ML Extensions</a> — real-time upscaling in a game engine pipeline.</li>
      <li><a href="https://learn.arm.com/learning-paths/mobile-graphics-and-gaming/profiling-ml-on-arm/" target="_blank">Profile the Performance of AI and ML Mobile Applications on Arm</a> — measure execution time and optimize performance.</li>
      <li><a href="https://learn.arm.com/learning-paths/mobile-graphics-and-gaming/using_unity_machine_learning_agents/" target="_blank">Deploy Unity Machine Learning Agents on Arm Android devices</a> — integrate ML agents in a Unity workflow.</li>
      <li><a href="https://learn.arm.com/learning-paths/mobile-graphics-and-gaming/ai-camera-pipelines/" target="_blank">Accelerate Denoising, Background Blur and Low-Light Camera Effects with SME2</a> — apply SME2 acceleration to real-time vision effects.</li>
    </ul>

    <br />
    <p>These paths give you a practical starting point from GPU execution to profiling and engine-specific deployment.</p>
  `;

}

function renderDocker() {
  document.getElementById("mainContent").innerHTML = `
    <p><strong>AI Overview</strong></p>
    <p>Here’s a quick walkthrough to install Docker Engine on Linux.</p>

    <p>Step 1: Install Docker Engine.</p>
<pre>
curl -fsSL get.docker.com -o get-docker.sh && sh get-docker.sh
</pre>

    <br />
    <p>Step 2: Add your user to the docker group so you can run Docker without sudo.</p>
<pre>
sudo usermod -aG docker $USER ; newgrp docker
</pre>

    <br />
    <p>Step 3: Verify the installation with a test container.</p>
<pre>
docker run hello-world
</pre>
    <br />
    <p>The output should be a welcome message such as:</p>
<pre>
Hello from Docker!
</pre>

    <br />
    <p>You can refer to the <a href="https://learn.arm.com/install-guides/docker/docker-engine/" target="_blank">Docker Engine Install Guide</a> for more details.</p>
  `;

}


function renderRedisOptions() {
  document.getElementById("mainContent").innerHTML = `
    <div class="aio-query">Deploy Redis on Arm cloud</div>
    <h3>Where do you want to deploy Redis?</h3>

    <div class="aio-options">
      <button onclick="handleOption('azure')">A) Azure Cobalt 100 VMs</button>
      <button onclick="handleOption('gcp')">B) Google Cloud C4A</button>
      <button onclick="handleOption('other')">C) Other</button>
    </div>
  `;
}

function handleOption(type) {
  showLoader();
  setTimeout(() => {
    if (type === "azure") renderAzure();
    if (type === "gcp") renderGCP();
    if (type === "other") renderOther();
  }, 2000);
}

function renderAzure() {
  document.getElementById("mainContent").innerHTML = `
    <p>
      This learning path walks through deploying Redis on Azure Cobalt 100 Arm64 virtual machines, starting from provisioning the VM all the way through validating that Redis is running correctly. You install Redis using the system package manager, start the service, and verify connectivity using the Redis CLI to ensure the instance is responding as expected.
    </p>

    <p>
      From there, it goes beyond basic setup into real usage patterns. You explore Redis Pub/Sub for real-time messaging between services, and Redis Streams for handling event-driven workloads. These examples help demonstrate how Redis is typically used in production systems on Arm-based cloud infrastructure.
    </p>

    <p>
      The final part focuses on performance validation using tools like <code>redis-benchmark</code>, giving you a sense of throughput and latency on Cobalt 100. If you’re looking to optimize performance further, check out the Redis tuning guide below. And if your use case is specifically caching, there’s a dedicated learning path for that as well.
    </p>

<pre>
sudo apt update
sudo apt install redis-server -y

redis-cli ping

redis-benchmark -q -n 10000 -c 50
</pre>
  `;

}


function renderGCP() {
  document.getElementById("mainContent").innerHTML = `
    <p>
      This learning path shows how to deploy Redis on Google Cloud C4A Arm-based virtual machines (powered by Axion). You start by provisioning a VM, installing Redis, and verifying that the service is running correctly using standard CLI tools.
    </p>

    <p>
      Once Redis is up, the focus shifts to working with in-memory datasets and executing queries efficiently. The examples demonstrate how Redis can be used for fast data access patterns, making it ideal for workloads that require low latency and high throughput.
    </p>

    <p>
      The guide also includes benchmarking using <code>redis-benchmark</code> to evaluate performance on Arm-based cloud infrastructure. If you want to go deeper on optimization, the tuning guide linked below is a good next step. And for cache-specific use cases, there’s a separate learning path covering Redis as a caching layer.
    </p>

<pre>
sudo apt update
sudo apt install redis-server -y

redis-benchmark -q -n 10000
</pre>
  `;

}

function renderOther() {
  document.getElementById("mainContent").innerHTML = `
    <p>This deployment scenario is not supported in this prototype.</p>
  `;

}

function resetUI() {
  document.getElementById("layout").style.display = "none";
  document.getElementById("examples").style.display = "flex";
  document.getElementById("searchInput").value = "";
}
</script>

{{ end }}
