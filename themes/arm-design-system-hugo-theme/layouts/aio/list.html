{{ define "main" }}

<div class="c-row u-margin-top-2">
  <div class="c-col">

    <div class="aio-container">

      <h1 class="aio-title">AI Overview</h1>
      <p class="aio-subtitle">
        Ask a question about Arm development — answers are grounded in Arm Learning Paths and install guides.
      </p>

      <!-- Search -->
      <div class="aio-search-box">
        <input id="searchInput" class="aio-search-input" placeholder="Ask anything about Arm development..." />
        <button class="aio-submit-btn" onclick="runQuery()">Ask</button>
      </div>

      <!-- Example prompts -->
      <div id="examples" class="aio-examples">
        <button class="aio-chip" onclick="prefill('How do I install Docker Engine on Linux?')">
          How do I install Docker Engine on Linux?
        </button>
        <button class="aio-chip" onclick="prefill('Deploy Redis on Arm cloud')">
          Deploy Redis on Arm cloud
        </button>
        <button class="aio-chip" onclick="prefill('What are the learning paths showing SME?')">
          What are the learning paths showing SME?
        </button>
      </div>

      <!-- Layout -->
      <div id="layout" class="aio-layout">

        <!-- LEFT -->
        <div class="aio-left">
          <div id="mainContent" class="aio-card"></div>
        </div>

        <!-- RIGHT -->
        <div class="aio-right">
          <div class="aio-card">
            <h3>Sources</h3>
            <div id="sources"></div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<!-- Bottom spacing -->
<div style="height:200px;"></div>

<style>
.aio-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 10px 10px 40px 10px;
}

.aio-title {
  color: #fff;
  margin-bottom: 8px;
}

.aio-subtitle {
  color: #A3A8AE;
  margin-bottom: 24px;
}

.aio-search-box {
  background: #1f2328;
  border: 1px solid #2d333b;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
  display: flex;
  gap: 12px;
  align-items: center;
}

.aio-submit-btn {
  background: #238636;
  border: none;
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  font-size: 14px;
}

.aio-submit-btn:hover {
  background: #2ea043;
}

.aio-search-input {
  width: 100%;
  background: transparent;
  border: none;
  color: #e6edf3;
  font-size: 16px;
}

.aio-examples {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.aio-chip {
  background: #2d333b;
  border: 1px solid #444c56;
  color: #c9d1d9;
  padding: 10px 16px;
  border-radius: 20px;
  cursor: pointer;
}

.aio-chip:hover {
  background: #373e47;
}

.aio-layout {
  display: none;
  margin-top: 30px;
  gap: 24px;
}

.aio-left {
  flex: 2;
}

.aio-right {
  flex: 1;
}

.aio-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
  color: #e6edf3;
}

.aio-query {
  font-weight: 600;
  margin-bottom: 12px;
}

pre {
  background: #0d1117;
  border: 1px solid #30363d;
  padding: 14px;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 13px;
}

.aio-options button {
  width: 100%;
  margin: 8px 0;
  padding: 12px;
  background: #21262d;
  border: 1px solid #30363d;
  color: #c9d1d9;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
}

.aio-options button:hover {
  background: #2d333b;
}

.aio-reset {
  background: #30363d;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
}

.aio-source a {
  color: #58a6ff;
  text-decoration: none;
}

.aio-source a:hover {
  text-decoration: underline;
}

.loader-wrap {
  display: flex;
  justify-content: center;
  padding: 40px 0;
}

@media (max-width: 900px) {
  .aio-layout {
    flex-direction: column;
  }
}
</style>

<script>
const AIO_BACKEND = {{ .Site.Params.aio_backend_url | default "http://localhost:5001" | jsonify }};

function prefill(text) {
  document.getElementById("searchInput").value = text;
}

function showLoader() {
  document.getElementById("mainContent").innerHTML = `
    <div class="loader-wrap">
      <ads-loader label="loading"></ads-loader>
    </div>
  `;
  document.getElementById("sources").innerHTML = "";
}

async function runQuery() {
  const query = document.getElementById("searchInput").value.trim();
  if (!query) return;

  document.getElementById("layout").style.display = "flex";
  document.getElementById("examples").style.display = "none";
  showLoader();

  try {
    const resp = await fetch(`${AIO_BACKEND}/query`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || `Server error ${resp.status}`);
    }

    const data = await resp.json();
    renderAnswer(data.answer, data.sources || []);
  } catch (e) {
    document.getElementById("mainContent").innerHTML = `
      <p style="color:#f85149;"><strong>Error:</strong> ${e.message}</p>
      <p style="color:#8b949e;">Make sure the backend server is running:<br>
      <code>cd tools/aio-backend && python3 server.py</code></p>
    `;
    document.getElementById("sources").innerHTML = "";
  }
}

function renderAnswer(answer, sources) {
  // Convert simple markdown-like formatting to HTML
  const html = answer
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\n\n/g, "</p><p>")
    .replace(/\n/g, "<br>");

  document.getElementById("mainContent").innerHTML =
    `<p>${html}</p>
     <button class="aio-reset" onclick="resetUI()">&#8592; Ask another question</button>`;

  const seen = new Set();
  const uniqueSources = sources.filter(s => {
    if (!s.url || seen.has(s.url)) return false;
    seen.add(s.url);
    return true;
  });

  document.getElementById("sources").innerHTML = uniqueSources.length
    ? uniqueSources.map(s => `
        <div class="aio-source">
          <a href="${s.url}" target="_blank">${s.title || s.url}</a>
        </div>`).join("")
    : "<p style='color:#8b949e;'>No sources returned.</p>";
}

// Allow pressing Enter in the search box
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("searchInput").addEventListener("keydown", e => {
    if (e.key === "Enter") runQuery();
  });
});

function resetUI() {
  document.getElementById("layout").style.display = "none";
  document.getElementById("examples").style.display = "flex";
  document.getElementById("searchInput").value = "";
}
</script>


{{ end }}
