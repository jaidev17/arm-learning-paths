{{/* chat-ai widget: injected after auth init, shown only for signed-in users */}}
<div id="chat-ai-container"></div>

<script>
    (function () {
        function initChatAiWidget() {
            const account = getAccount(); //from static/js/authentication.js, returns null if not signed in
            if (!account) return;

            const rawEmails = account.idTokenClaims && account.idTokenClaims.emails;
            const email = (Array.isArray(rawEmails) ? rawEmails[0] : rawEmails)
                || (account.idTokenClaims && account.idTokenClaims.sub)
                || account.name;

            const chatAi = document.createElement('chat-ai');
            chatAi.setAttribute('app-name', 'learning-paths');
            chatAi.setAttribute('redirect-url', window.location.origin + '/');
            chatAi.setAttribute('title', 'Arm Developer Assistant');
            chatAi.setAttribute('beta', 'false');
            chatAi.setAttribute('content', `
              <p>
                Welcome to the <strong>Arm Developer Assistant</strong>
              </p>
              <p>
                Discover the right technical content faster
              </p>
              <br>
              <p>
                Arm Developer Assistant helps developers find relevant Learning Paths, tools, and implementation guidance across AI, cloud, and multi-architecture development.
              </p>
              <br><br><br>
              <p>
                Arm Developer Assistant responses are AI-generated and may contain errors - please verify any response generated by the service before relying on it.
              </p>
              <br>
              <p>
                Use of the Arm Developer Assistant is subject to the terms of the <a href="https://ipexplorer.arm.com/vfae-terms-and-conditions" target="_blank" rel="noopener">Arm Developer Assistant Terms and Conditions of Use</a>.
              </p>
            `);
            if (email) {
                chatAi.setAttribute('login-hint', email);
            }
            document.getElementById('chat-ai-container').appendChild(chatAi);
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (window.authInitPromise) {
                window.authInitPromise.then(initChatAiWidget).catch(initChatAiWidget);
            } else {
                var waited = 0;
                var interval = setInterval(function () {
                    waited += 50;
                    if (window.authInitPromise) {
                        clearInterval(interval);
                        window.authInitPromise.then(initChatAiWidget).catch(initChatAiWidget);
                    } else if (waited >= 3000) {
                        clearInterval(interval);
                        initChatAiWidget();
                    }
                }, 50);
            }
        });
    })();
</script>
