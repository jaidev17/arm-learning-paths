{{/* chat-ai widget: injected after auth init, shown only for signed-in users */}}
<div id="chat-ai-container"></div>

<script>
    (function () {
        function initChatAiWidget() {
            const account = getAccount();
            if (!account) return;

            const rawEmails = account.idTokenClaims && account.idTokenClaims.emails;
            const email = (Array.isArray(rawEmails) ? rawEmails[0] : rawEmails)
                || (account.idTokenClaims && account.idTokenClaims.sub)
                || account.name;

            const chatAi = document.createElement('chat-ai');
            chatAi.setAttribute('app-name', 'learning-paths');
            chatAi.setAttribute('redirect-url', window.location.origin + '/');
            chatAi.setAttribute('title', 'Arm Virtual Assistant');
            chatAi.setAttribute('beta', 'false');
            chatAi.setAttribute('content', `
              <p>
                <strong>Discover the right technical content faster</strong>
              </p>
              <p>
                Arm Virtual Assistant helps developers find relevant Learning Paths, tools, and implementation guidance across AI, cloud, and multi-architecture development.
              </p>
              <p style="margin-top: 3rem;">
                Responses are AI-generated (using Azure OpenAI) and may contain errors — please verify answers before relying on them. Responses may include confidential information of Arm and third parties. You must handle all outputs in accordance with the Arm IP Explorer Terms of Service (see link below) and must not disclose them to any third party except as permitted under those terms. Do not input or request information unless you are authorised to access and use it. Your use of IP Explorer, including this AI assistant, is subject to the <a href="https://content.ipexplorer.arm.com/VirtualFAE/IPExplorer/TNC/Teams_And_Conditions-VirtualFAE.pdf" target="_blank" rel="noopener">Arm IP Explorer Terms of Service</a>.
              </p>
            `);
            if (email) {
                chatAi.setAttribute('login-hint', email);
            }
            document.getElementById('chat-ai-container').appendChild(chatAi);
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (window.authInitPromise) {
                window.authInitPromise.then(initChatAiWidget).catch(initChatAiWidget);
            } else {
                var waited = 0;
                var interval = setInterval(function () {
                    waited += 50;
                    if (window.authInitPromise) {
                        clearInterval(interval);
                        window.authInitPromise.then(initChatAiWidget).catch(initChatAiWidget);
                    } else if (waited >= 3000) {
                        clearInterval(interval);
                        initChatAiWidget();
                    }
                }, 50);
            }
        });
    })();
</script>
